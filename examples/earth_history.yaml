# Earth integrated from formation (history mode). Present-state fields (pressure,
# composition, albedo, O2, water) are left to the physics so they can be compared
# with the snapshot values of examples/earth.yaml.
name: Earth (history)
seed: 0
mode: history

star:
  mass_msun: 1.0
  age_gyr: 4.57
  metallicity_feh: 0.0
  activity_percentile: 0.5

orbit:
  semi_major_axis_au: 1.0
  eccentricity: 0.0167
  obliquity_deg: 23.44
  rotation_period_h: 23.934
  periapsis_longitude_deg: 283

body:
  mass_mearth: 1.0
  core_mass_fraction: 0.325
  envelope_mass_fraction: 0.0
  radiogenic_abundance: 1.0
  tidal_heating_w: 0
  tidal_q: 100

interior:
  tectonic_regime: mobile_lid       # held through the history unless physics breaks it

atmosphere:
  volatile_richness: 1.0

biosphere:
  biochemistry: oxygenic         # where life lives is left to the history: ocean first, land after colonisation

history:
  epochs_gyr: [0.5, 1.0, 2.0, 2.5, 3.0, 4.0]
  initial_water_mass_fraction: 0.00064
  carbon_inventory: 1.0
  nitrogen_inventory: 1.0
  initial_mantle_temperature_k: 1750
  outgassing_efficiency: 1.0
  weathering_efficiency: 1.0
  weathering_temperature_scale_k: 20
  weathering_co2_exponent: 0.45
  biotic_weathering_factor: 4
  escape_efficiency: 0.15
  mantle_activation_energy_kj: 300
  core_adiabatic_heat_flow: 1.0
  life_origin_delay_gyr: 0.4
  oxygen_burial_efficiency: 1.0
  reductant_decay_gyr: 3.0
  land_colonisation_delay_gyr: 3.4
