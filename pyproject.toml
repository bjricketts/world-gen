[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldgen"
version = "0.1.0"
description = "Physically motivated planet generator for world building"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.9",
    "xarray>=2023.1",
    "zarr>=2.16",
    "matplotlib>=3.7",
    "cartopy>=0.22",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3", "nbclient>=0.9", "nbformat>=5.9", "ipykernel>=6"]
notebooks = ["jupyterlab>=4"]

[project.scripts]
worldgen = "worldgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["worldgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: generates worlds or runs the tectonic simulation (deselect with -m \"not slow\")"]
